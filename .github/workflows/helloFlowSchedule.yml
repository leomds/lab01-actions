# Exercicio 02 - ativacao programada via schedule (cron a cada 5 minutos)
name: Hello Flow (agendado)
on:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Diga oi
        run: echo "Hello World!"
      - name: Diga valeu
        run: echo "Valeu - bye!"
